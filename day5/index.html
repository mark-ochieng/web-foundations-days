<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 - User Directory</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background: #f4f7f9;
      color: #263238;
    }

    header {
      background: #087f8c;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    main {
      width: min(900px, 92%);
      margin: 30px auto;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0;
    }

    input,
    button {
      font: inherit;
      padding: 10px 14px;
      border-radius: 6px;
    }

    input {
      flex: 1;
      min-width: 200px;
      border: 1px solid #b0bec5;
    }

    button {
      border: none;
      background: #087f8c;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #05636d;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      min-height: 24px;
    }

    #users-list {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    #users-list li {
      background: white;
      padding: 18px;
      border-radius: 8px;
      border: 1px solid #dce4e8;
      overflow-wrap: anywhere;
    }

    #users-list h3 {
      margin-top: 0;
      color: #087f8c;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #167344;
    }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <header>
    <h1>User Directory</h1>
    <p>Day 5 Assignment: Client-Server Communication</p>
  </header>

  <main>
    <h2>Users</h2>
    <p>Load users from the API and filter them by name.</p>

    <div class="controls">
      <button id="load-users" type="button">Load Users</button>

      <input
        type="text"
        id="filter-input"
        aria-label="Filter users by name"
        placeholder="Filter users by name..."
      >
    </div>

    <p id="status" role="status" aria-live="polite">
      Click "Load Users" to fetch users.
    </p>

    <ul id="users-list"></ul>
  </main>
</body>
</html>
